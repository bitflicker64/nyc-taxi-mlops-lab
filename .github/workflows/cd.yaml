# CD (S0, blue-green from S3): after ci succeeds on main, deploy that commit's app image to the idle
# colour on the app host, smoke-test it there, then switch traffic to it. The live colour keeps running
# until the next deploy, so rolling back is a switch (rollback.yaml), not a rebuild.
#
# Decisions (records in decisions/): runner credentials are the host's instance profile (001); the
# image tag is sha-<7> (002); the switch is automatic once the idle colour passes its smoke test (011).
#
# Separate from ci.yaml on purpose: ci runs for pull requests, and a workflow that does must never
# have a self-hosted job (tools/check_workflows.py). workflow_run fires for every ci run, forks' PR
# runs included, so the job only runs for a successful push or manual run of main in this repo.
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-app
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, lab-app]
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      LLM_HOST: ${{ vars.LLM_HOST }}
    steps:
      # The commit ci built, not whatever main is now: compose and Traefik config match the image.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pick the idle colour
        run: |
          deploy/web.sh prepare
          live=$(deploy/web.sh live)
          idle=$([[ $live == blue ]] && echo green || echo blue)
          new_tag="sha-${HEAD_SHA::7}"
          # The live colour keeps the tag it runs; only the idle one gets the new image.
          if [[ $live == none ]]; then live_tag=none; else live_tag=$(deploy/web.sh tag "$live"); fi
          {
            echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "LIVE=$live"
            echo "IDLE=$idle"
            if [[ $idle == blue ]]; then echo "BLUE_TAG=$new_tag"; echo "GREEN_TAG=$live_tag"
            else echo "GREEN_TAG=$new_tag"; echo "BLUE_TAG=$live_tag"; fi
          } >> "$GITHUB_ENV"
          echo "live: $live ($live_tag); deploying $new_tag to $idle"
      - name: Deploy to the idle colour
        # --no-deps: only the idle colour is (re)created. --remove-orphans: S0's single `app` container goes
        # on the first blue-green deploy (a short gap that one time, while Traefik changes config).
        run: |
          docker compose -f deploy/compose.web.yaml pull "app-$IDLE"
          docker compose -f deploy/compose.web.yaml up -d --wait --no-deps --remove-orphans "app-$IDLE"
      - name: Smoke-test the idle colour before any rider sees it
        run: deploy/web.sh smoke "$IDLE" "$HEAD_SHA"
      - name: Switch traffic
        run: |
          deploy/web.sh switch "$IDLE"
          echo "SWITCHED=true" >> "$GITHUB_ENV"
      - name: Smoke-test what riders get
        run: |
          base=http://127.0.0.1
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 "$base/version" |
            jq -e --arg sha "$HEAD_SHA" '.git_sha == $sha'
          curl -fsS -X POST "$base/predict" -H 'Content-Type: application/json' \
            -d '{"pickup_zone_id": 132, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}'
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/predict" -H 'Content-Type: application/json' \
            -d '{"pickup_zone_id": 999, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}')
          [ "$code" = 422 ] || { echo "invalid zone returned $code, want 422" >&2; exit 1; }
          deploy/web.sh status
      - name: Switch back if riders' check failed
        # Only after a switch, and only if there was a colour live before it.
        if: failure() && env.SWITCHED == 'true' && env.LIVE != 'none'
        run: deploy/web.sh switch "$LIVE"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
