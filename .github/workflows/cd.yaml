# CD (S0): after ci succeeds on main, deploy that commit's app image on the app host through its
# self-hosted runner (label lab-app), then smoke-test it.
#
# Runner credentials (decision record in decisions/): the host's instance profile. Nothing here holds
# AWS keys; GHCR is reached with this run's GITHUB_TOKEN.
#
# Separate from ci.yaml on purpose: ci runs for pull requests, and a workflow that does must never
# have a self-hosted job (tools/check_workflows.py). workflow_run fires for every ci run, forks' PR
# runs included, so the job only runs for a successful push or manual run of main in this repo.
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-app
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, lab-app]
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # The commit ci built, not whatever main is now: compose and Traefik config match the image.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Image name and tag
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: |
          docker compose -f deploy/compose.app.yaml pull
          docker compose -f deploy/compose.app.yaml up -d --wait --remove-orphans
      - name: Smoke test through Traefik
        run: |
          base=http://127.0.0.1
          # The commit that answers is the one we deployed, not a stale container.
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 "$base/version" |
            jq -e --arg sha "$HEAD_SHA" '.git_sha == $sha'
          curl -fsS "$base/healthz"
          echo
          curl -fsS -X POST "$base/predict" -H 'Content-Type: application/json' \
            -d '{"pickup_zone_id": 132, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}'
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/predict" -H 'Content-Type: application/json' \
            -d '{"pickup_zone_id": 999, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}')
          [ "$code" = 422 ] || { echo "invalid zone returned $code, want 422" >&2; exit 1; }
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
